# Baza: SQLite (kod bilan birga keladi). Kontent main/fixtures/initial_data.json
# dan har deploy'da start.sh orqali yuklanadi. Postgres ishlatilmaydi —
# shuning uchun bepul Postgres'ning 30-kunlik muddati muammosi ham yo'q.
# DATABASE_URL berilmagani uchun settings.py avtomatik SQLite'ga tushadi.

services:
  - type: web
    name: tiiu-website
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://tiiu-website.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
